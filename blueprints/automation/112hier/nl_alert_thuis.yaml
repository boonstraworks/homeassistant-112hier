blueprint:
  name: 112hier — NL-Alert voor jouw huis
  description: >
    Doet wat een NL-Alert je vraagt, zodra je huis binnen het uitzendgebied ligt.

    Bij een brand met veel rook of een gaswolk is het advies bijna altijd:
    ramen en deuren dicht, ventilatie uit. Deze automatisering zet de
    ventilatie (of WTW, airco, afzuigkap) die je kiest meteen uit en stuurt een
    bericht naar je telefoon met de tekst en de adviezen. Is het alert
    opgeheven, dan krijg je daar ook bericht van en mag de ventilatie desgewenst
    weer aan.

    Werkt met de schakelaar "NL-Alert voor jouw locatie" van de
    112hier-integratie. "Jouw huis" is de locatie uit de Home
    Assistant-instellingen. Het landelijke testbericht (juni en december)
    zet de schakelaar niet aan.
  domain: automation
  source_url: https://github.com/stevenb211/homeassistant-112hier/blob/main/blueprints/automation/112hier/nl_alert_thuis.yaml
  author: 112hier.nl

  input:
    schakelaar:
      name: NL-Alert-schakelaar
      description: De binary_sensor "NL-Alert voor jouw locatie" van 112hier.
      selector:
        entity:
          filter:
            - integration: 112hier
              domain: binary_sensor

    waarheen:
      name: Waar naartoe
      description: De notify-dienst van je telefoon, bijvoorbeeld notify.mobile_app_telefoon_van_jan. Leeg laten = geen bericht.
      default: ""
      selector:
        text:

    uitzetten:
      name: Wat uit moet
      description: Ventilatie, WTW, airco of afzuigkap die uit moet bij een alert. Leeg laten = niets uitzetten.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: [fan, climate, switch, humidifier]

    weer_aan:
      name: Weer aanzetten na opheffing
      description: Zet wat je hierboven koos weer aan zodra het alert voorbij is.
      default: false
      selector:
        boolean:

mode: queued

trigger:
  # Zonder "from": ook "onbekend" of "niet beschikbaar" → "aan" telt mee.
  # Begint een alert net als 112hier even niet bereikbaar was, dan mis je het
  # anders. Alleen een wijziging van de stand telt, niet van de details.
  - platform: state
    entity_id: !input schakelaar
    to: "on"
    id: aan
  - platform: state
    entity_id: !input schakelaar
    from: "on"
    to: "off"
    id: uit
  # Begon het alert terwijl Home Assistant herstartte, dan ging de schakelaar
  # van "onbekend" naar "aan" en vuurde de trigger hierboven niet. Na het
  # opstarten kijken we daarom één keer of er een alert actief is.
  - platform: homeassistant
    event: start
    id: start

variables:
  waarheen: !input waarheen
  uitzetten: !input uitzetten
  weer_aan: !input weer_aan
  schakelaar: !input schakelaar

action:
  - choose:
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: aan
              - condition: and
                conditions:
                  - condition: trigger
                    id: start
                  - condition: state
                    entity_id: !input schakelaar
                    state: "on"
          # Dit alert nog niet afgehandeld? Na een herstart midden in een alert
          # dat je al kreeg, komt er geen tweede bericht en gaat wat je zelf
          # weer aanzette niet opnieuw uit.
          - condition: template
            value_template: >-
              {% set st = state_attr(schakelaar, 'start') %}
              {% set begin = as_datetime(st) if st else none %}
              {% set vorige = this.attributes.last_triggered if this is defined and this.attributes is defined else none %}
              {{ vorige is none or begin is none or begin > vorige }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ uitzetten | length > 0 }}"
            then:
              - action: homeassistant.turn_off
                target:
                  entity_id: "{{ uitzetten }}"
              # Even wachten tot het ook echt uit staat; een apparaat dat net
              # offline is, wordt door Home Assistant stil overgeslagen.
              - wait_template: "{{ uitzetten | reject('is_state', 'off') | list | count == 0 }}"
                timeout: "00:01:00"
                continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ waarheen | length > 0 }}"
            then:
              - action: "{{ waarheen }}"
                data:
                  title: "NL-Alert voor jouw huis"
                  message: >-
                    {{ state_attr(schakelaar, 'kop') }}.
                    {% set a = state_attr(schakelaar, 'adviezen') or [] %}{% if a %}Advies: {{ a | join(', ') | lower }}.{% endif %}
                    {% set nog_aan = uitzetten | reject('is_state', 'off') | list %}
                    {% if uitzetten | length > 0 %}{% if nog_aan %}Let op: uitzetten is niet gelukt voor {{ nog_aan | map('state_attr', 'friendly_name') | join(', ') }}; zet dit zelf uit.{% else %}De ventilatie is uitgezet.{% endif %}{% endif %}
                  data:
                    url: "{{ state_attr(schakelaar, 'url') }}"
                    clickAction: "{{ state_attr(schakelaar, 'url') }}"
                    importance: high
                    priority: high
                    ttl: 0
      - conditions:
          - condition: trigger
            id: uit
        sequence:
          - if:
              - condition: template
                value_template: "{{ weer_aan and uitzetten | length > 0 }}"
            then:
              - action: homeassistant.turn_on
                target:
                  entity_id: "{{ uitzetten }}"
          - if:
              - condition: template
                value_template: "{{ waarheen | length > 0 }}"
            then:
              - action: "{{ waarheen }}"
                data:
                  title: "NL-Alert voorbij"
                  message: >-
                    Het NL-Alert voor jouw huis is opgeheven of afgelopen.
                    {% if weer_aan and uitzetten | length > 0 %}De ventilatie staat weer aan.{% endif %}
